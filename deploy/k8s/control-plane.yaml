apiVersion: apps/v1
kind: Deployment
metadata:
  name: computeharbor-control-plane
  labels:
    app.kubernetes.io/name: computeharbor-control-plane
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: computeharbor-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: computeharbor-control-plane
        app.kubernetes.io/component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
      containers:
        - name: control-plane
          image: ghcr.io/computeharbor/control-plane:latest
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - -addr
            - ":8080"
            - -state-file
            - /var/lib/computeharbor/state.json
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: state-data
              mountPath: /var/lib/computeharbor
      volumes:
        - name: state-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: computeharbor-control-plane
  labels:
    app.kubernetes.io/name: computeharbor-control-plane
    app.kubernetes.io/component: control-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: computeharbor-control-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
