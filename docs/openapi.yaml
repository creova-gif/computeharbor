openapi: 3.1.0
info:
  title: ComputeHarbor Control Plane API
  version: 0.1.0
  description: |
    HTTP/JSON control plane for spot-GPU LoRA training orchestration, preemption
    failover, multi-cloud fleet placement, cost estimation, and organization billing.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080
    description: Local control plane server

tags:
  - name: System
    description: Health and Prometheus observability endpoints
  - name: Jobs
    description: Spot-GPU training job lease lifecycle and checkpointing
  - name: Scheduling
    description: Spot pool scheduling, cost ranking, and multi-region fleet placement
  - name: Billing
    description: Organization spot savings and platform fee summaries

paths:
  /healthz:
    get:
      tags: [System]
      summary: Control plane liveness probe
      operationId: getHealthz
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    examples: ["ok"]

  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics exposition
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus text exposition format metrics
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - |
                    # HELP computeharbor_jobs_total Current number of jobs by status.
                    # TYPE computeharbor_jobs_total gauge
                    computeharbor_jobs_total{status="RUNNING"} 1

  /v1/jobs:
    post:
      tags: [Jobs]
      summary: Submit a new spot-GPU training job
      operationId: submitJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitJobRequest"
      responses:
        "201":
          description: Job created in QUEUED state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLease"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      tags: [Jobs]
      summary: List jobs for an organization
      operationId: listJobs
      parameters:
        - $ref: "#/components/parameters/OrgIDHeader"
      responses:
        "200":
          description: List of job leases belonging to the organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobLease"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobIDPath"
      - $ref: "#/components/parameters/OrgIDHeader"
    get:
      tags: [Jobs]
      summary: Fetch a job lease by ID
      operationId: getJob
      responses:
        "200":
          description: Current job lease state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLease"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/jobs/{id}/assign:
    parameters:
      - $ref: "#/components/parameters/JobIDPath"
      - $ref: "#/components/parameters/OrgIDHeader"
    post:
      tags: [Jobs]
      summary: Assign a worker node to a queued or migrating job
      operationId: assignWorker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerNodeRequest"
      responses:
        "200":
          description: Job transitioned to RUNNING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLease"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/jobs/{id}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/JobIDPath"
      - $ref: "#/components/parameters/OrgIDHeader"
    post:
      tags: [Jobs]
      summary: Record a worker heartbeat for a running job lease
      operationId: heartbeatJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerNodeRequest"
      responses:
        "200":
          description: Lease heartbeat timestamp updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLease"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/jobs/{id}/sigterm:
    parameters:
      - $ref: "#/components/parameters/JobIDPath"
      - $ref: "#/components/parameters/OrgIDHeader"
    post:
      tags: [Jobs]
      summary: Notify the control plane of a spot eviction SIGTERM
      operationId: notifySigterm
      responses:
        "200":
          description: Job transitioned to CHECKPOINTING (or idempotent existing state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLease"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/jobs/{id}/checkpoint:
    parameters:
      - $ref: "#/components/parameters/JobIDPath"
      - $ref: "#/components/parameters/OrgIDHeader"
    post:
      tags: [Jobs]
      summary: Commit a flushed LoRA checkpoint reference
      operationId: commitCheckpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckpointRef"
      responses:
        "200":
          description: Checkpoint committed; job transitions to MIGRATING or COMPLETED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLease"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/jobs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobIDPath"
      - $ref: "#/components/parameters/OrgIDHeader"
    post:
      tags: [Jobs]
      summary: Cancel an active or queued job
      operationId: cancelJob
      responses:
        "200":
          description: Job transitioned to CANCELLED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLease"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/schedule:
    post:
      tags: [Scheduling]
      summary: Select the lowest-cost eligible spot GPU pool and alternatives
      operationId: scheduleWorkload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleRequest"
      responses:
        "200":
          description: Selected spot pool and ranked alternatives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/cost/rank:
    get:
      tags: [Scheduling]
      summary: Rank GPU pools by estimated net customer cost
      operationId: rankCost
      parameters:
        - name: min_vram
          in: query
          description: Minimum GPU VRAM in GB
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: count
          in: query
          description: Number of GPUs required
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: hours
          in: query
          description: Active training duration in hours
          schema:
            type: number
            format: double
            exclusiveMinimum: 0
            default: 10.0
        - name: fee
          in: query
          description: Platform savings fee fraction (0 to 0.5)
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 0.5
            default: 0.12
      responses:
        "200":
          description: Ranked cost estimates sorted by lowest net customer cost
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EstimateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/fleet/rank:
    get:
      tags: [Scheduling]
      summary: Rank multi-cloud regional spot pools by composite cost and availability score
      operationId: rankFleet
      parameters:
        - name: min_vram
          in: query
          description: Minimum GPU VRAM in GB
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: min_availability
          in: query
          description: Minimum regional availability score in [0, 1]
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 1
            default: 0.0
        - name: provider
          in: query
          description: Optional cloud provider filter
          schema:
            type: string
            enum: [gcp, aws, oci]
      responses:
        "200":
          description: Ranked regional fleet placements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FleetPlacement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/billing/summary:
    get:
      tags: [Billing]
      summary: Get aggregated spot savings and billing summary for an organization
      operationId: getBillingSummary
      parameters:
        - $ref: "#/components/parameters/OrgIDHeader"
      responses:
        "200":
          description: Organization billing and savings summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  parameters:
    OrgIDHeader:
      name: X-Org-ID
      in: header
      required: true
      description: Organization identifier for multi-tenant isolation and rate limiting
      schema:
        type: string
        minLength: 1
      example: org-acme
    JobIDPath:
      name: id
      in: path
      required: true
      description: Unique job identifier
      schema:
        type: string
        minLength: 1
      example: job-lora-001

  responses:
    BadRequest:
      description: Malformed request or missing required fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Missing or mismatched X-Org-ID header
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Job not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource conflict or invalid state transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Validation failed for domain constraints
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Per-organization rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    GPUType:
      type: string
      enum:
        - nvidia-l4-24gb
        - nvidia-a10g-24gb
        - nvidia-a100-40gb
        - nvidia-a100-80gb
        - nvidia-h100-80gb

    JobStatus:
      type: string
      enum:
        - QUEUED
        - RUNNING
        - CHECKPOINTING
        - MIGRATING
        - COMPLETED
        - FAILED
        - CANCELLED

    SubmitJobRequest:
      type: object
      required: [job_id, org_id, gpu, target_steps, max_preemptions]
      properties:
        job_id:
          type: string
          minLength: 1
        org_id:
          type: string
          minLength: 1
        gpu:
          $ref: "#/components/schemas/GPUType"
        target_steps:
          type: integer
          minimum: 1
        max_preemptions:
          type: integer
          minimum: 0

    WorkerNodeRequest:
      type: object
      required: [worker_node_id]
      properties:
        worker_node_id:
          type: string
          minLength: 1

    CheckpointRef:
      type: object
      required:
        - step
        - epoch
        - loss
        - safetensors_uri
        - manifest_uri
        - flushed_at
        - flush_latency_ms
      properties:
        step:
          type: integer
          minimum: 0
        epoch:
          type: integer
          minimum: 0
        loss:
          type: number
          format: double
        safetensors_uri:
          type: string
        manifest_uri:
          type: string
        flushed_at:
          type: string
          format: date-time
        flush_latency_ms:
          type: integer
          format: int64
          minimum: 0

    JobLease:
      type: object
      required:
        - job_id
        - org_id
        - gpu
        - status
        - target_steps
        - current_step
        - preemption_count
        - max_preemptions
        - updated_at
      properties:
        job_id:
          type: string
        org_id:
          type: string
        gpu:
          $ref: "#/components/schemas/GPUType"
        worker_node_id:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        target_steps:
          type: integer
        current_step:
          type: integer
        preemption_count:
          type: integer
        max_preemptions:
          type: integer
        latest_checkpoint:
          $ref: "#/components/schemas/CheckpointRef"
        updated_at:
          type: string
          format: date-time
        last_heartbeat_at:
          type: string
          format: date-time
        preempted_at:
          type: string
          format: date-time
        last_recovery_dur_ms:
          type: integer
          format: int64

    PoolQuote:
      type: object
      required:
        - GPU
        - Provider
        - Region
        - VRAMGB
        - OnDemandHourlyUSD
        - SpotHourlyUSD
        - MeanPreemptionRateH
      properties:
        GPU:
          $ref: "#/components/schemas/GPUType"
        Provider:
          type: string
        Region:
          type: string
        VRAMGB:
          type: integer
        OnDemandHourlyUSD:
          type: number
          format: double
        SpotHourlyUSD:
          type: number
          format: double
        MeanPreemptionRateH:
          type: number
          format: double

    EstimateResult:
      type: object
      required:
        - Quote
        - TotalWallHours
        - RecoveryOverheadHrs
        - OnDemandCostUSD
        - RawSpotCostUSD
        - GrossSavingsUSD
        - PlatformFeeUSD
        - NetCustomerCostUSD
        - GrossSavingsFraction
        - NetSavingsFraction
        - MeetsTargetSavings
      properties:
        Quote:
          $ref: "#/components/schemas/PoolQuote"
        TotalWallHours:
          type: number
          format: double
        RecoveryOverheadHrs:
          type: number
          format: double
        OnDemandCostUSD:
          type: number
          format: double
        RawSpotCostUSD:
          type: number
          format: double
        GrossSavingsUSD:
          type: number
          format: double
        PlatformFeeUSD:
          type: number
          format: double
        NetCustomerCostUSD:
          type: number
          format: double
        GrossSavingsFraction:
          type: number
          format: double
        NetSavingsFraction:
          type: number
          format: double
        MeetsTargetSavings:
          type: boolean

    ScheduleRequest:
      type: object
      required: [min_vram_gb, gpu_count, active_hours]
      properties:
        min_vram_gb:
          type: integer
          minimum: 0
        gpu_count:
          type: integer
          minimum: 1
        active_hours:
          type: number
          format: double
          exclusiveMinimum: 0
        fee_fraction:
          type: number
          format: double
          minimum: 0
          maximum: 0.5
          default: 0.12
        exclude_gpus:
          type: array
          items:
            $ref: "#/components/schemas/GPUType"

    ScheduleResponse:
      type: object
      required: [selected, alternatives]
      properties:
        selected:
          $ref: "#/components/schemas/EstimateResult"
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/EstimateResult"

    RegionalPool:
      type: object
      required:
        - gpu
        - provider
        - region
        - vram_gb
        - on_demand_hourly_usd
        - spot_hourly_usd
        - preemption_rate_h
        - availability_score
      properties:
        gpu:
          $ref: "#/components/schemas/GPUType"
        provider:
          type: string
        region:
          type: string
        vram_gb:
          type: integer
        on_demand_hourly_usd:
          type: number
          format: double
        spot_hourly_usd:
          type: number
          format: double
        preemption_rate_h:
          type: number
          format: double
        availability_score:
          type: number
          format: double

    FleetPlacement:
      type: object
      required:
        - pool
        - effective_hourly_usd
        - net_savings_fraction
        - composite_score
      properties:
        pool:
          $ref: "#/components/schemas/RegionalPool"
        effective_hourly_usd:
          type: number
          format: double
        net_savings_fraction:
          type: number
          format: double
        composite_score:
          type: number
          format: double

    BillingSummary:
      type: object
      required:
        - org_id
        - total_jobs
        - total_gpu_hours
        - on_demand_cost_usd
        - spot_cost_usd
        - gross_savings_usd
        - platform_fee_usd
        - net_customer_cost_usd
      properties:
        org_id:
          type: string
        total_jobs:
          type: integer
          minimum: 0
        total_gpu_hours:
          type: number
          format: double
          minimum: 0
        on_demand_cost_usd:
          type: number
          format: double
          minimum: 0
        spot_cost_usd:
          type: number
          format: double
          minimum: 0
        gross_savings_usd:
          type: number
          format: double
          minimum: 0
        platform_fee_usd:
          type: number
          format: double
          minimum: 0
        net_customer_cost_usd:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          default: USD
